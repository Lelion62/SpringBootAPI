server:
  port: 8084

spring:
  application:
    name: baseSpringBoot

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:base_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop # ou update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Configuration JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

# Utilisateur temporaire pour les tests
app:
  security:
    username: ${AUTH_USERNAME:admin}
    password: ${AUTH_PASSWORD:change-me}